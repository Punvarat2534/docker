services:
  frontend:
    build: ./frontend
    container_name: nuxt_app
    ports:
      - "3000:3000"
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: fastify_api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://avnadmin:AVNS_ENPGzGIrryeEhU0kBxa@pg-3289afdd-punvarat-7a2d.i.aivencloud.com:22067/scholar?sslmode=require
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: avnadmin
      POSTGRES_PASSWORD: AVNS_ENPGzGIrryeEhU0kBxa
      POSTGRES_DB: scholar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: